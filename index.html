<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- META TAGS
     O que são: informações sobre a página.
     Para que servem: ajudam o navegador a exibir a página corretamente.
     Quando usar: sempre dentro do <head>, uma vez para cada informação. -->
    <meta charset="UTF-8">
    <!-- Viewport 
     O que é: define como a página deve ser exibida em diferentes dispositivos.
     Para que serve: garante que a página seja responsiva e se ajuste a telas de diferentes tamanhos.
     Quando usar: sempre dentro do <head>, uma vez por página. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia de HTML e CSS</title>
    <!-- LINK DO CSS
     O que é: liga este HTML ao arquivo de estilos.
     Para que serve: sem ele, a página aparece sem cores nem layout.
     Quando usar: sempre dentro do <head>, uma vez para cada arquivo CSS. -->
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <!--HEADER
     O que é: cabeçalho da página.
        Para que serve: contém o título e o menu de navegação.
        Quando usar: sempre dentro do <body> -->
        <header>
            <!-- TÍTULO
             O que é: título da página.
             Para que serve: informa o assunto da página.
             Quando usar: sempre dentro do <header>, uma vez por página. -->
            <h1>Guia de HTML e CSS</h1>
            <!-- Nav (menu)
             O que é: menu de navegação da página.
             Para que serve: permite ao usuário navegar entre as seções da página.
             Quando usar: sempre dentro do <header>, geralmente uma no topo da página. -->
            <nav>
                <a href="#estrutura">Estrutura</a>
                <a href="#layout">Layout</a>
                <a href="#extras">Extras</a>
            </nav>
        </header>
</body>
</html>
